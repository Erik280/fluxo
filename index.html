<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SeuFluxo WhatsApp — Automatize seu atendimento e vendas pelo WhatsApp com inteligência." />
    <meta name="theme-color" content="#f1f3f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1a20" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SeuFluxo WhatsApp | Login</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('fluxo-theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <script src="/config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
